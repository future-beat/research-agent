name: CI

# Every gate here runs without API keys and without network access to the
# model providers. That is deliberate: a CI suite that needs a live key is a
# CI suite that breaks on forks, on key rotation, and on someone else's
# outage -- and it bills you for every push.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · tests · evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      # The graph must be importable and the whole eval suite runnable with no
      # credentials at all. If a lazily-constructed client ever becomes eager
      # again, this is the step that catches it.
      - name: Evals (offline)
        env:
          ANTHROPIC_API_KEY: ""
          VOYAGE_API_KEY: ""
        run: python -m evals --report evals-report.json --min-pass-rate 0.9

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: evals-report.json
          if-no-files-found: warn

  docker:
    name: image build · container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: research-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Booting the image is the point. A Dockerfile that builds but whose
      # entrypoint crashes on startup passes a build-only check and fails in
      # production, which is the worst place to find out.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name agent -p 8000:8000 \
            -e ANTHROPIC_API_KEY=ci-not-a-real-key \
            -e VOYAGE_API_KEY=ci-not-a-real-key \
            research-agent:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              break
            fi
            if [ "$i" = 30 ]; then
              echo "::error::container never became healthy"
              docker logs agent
              exit 1
            fi
            sleep 2
          done

          echo "--- /health ---"
          curl -fsS http://127.0.0.1:8000/health

          # Reachable without a working key, because none of them call out to
          # a model provider. If one ever starts to, this step fails.
          echo "--- /metrics ---"
          curl -fsS http://127.0.0.1:8000/metrics > /dev/null
          echo "--- /pricing ---"
          curl -fsS http://127.0.0.1:8000/pricing > /dev/null
          echo "--- /openapi.json ---"
          curl -fsS http://127.0.0.1:8000/openapi.json > /dev/null

          echo "--- docker's own healthcheck ---"
          for i in $(seq 1 20); do
            status=$(docker inspect --format='{{.State.Health.Status}}' agent)
            [ "$status" = "healthy" ] && break
            if [ "$i" = 20 ]; then
              echo "::error::HEALTHCHECK never reported healthy (last: $status)"
              docker logs agent
              exit 1
            fi
            sleep 3
          done

          echo "all smoke checks passed"

      - name: Container logs
        if: always()
        run: docker logs agent || true

      - name: Stop
        if: always()
        run: docker rm -f agent || true

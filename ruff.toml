# Lint config. CI runs `ruff check .`.
#
# Deliberately not `ruff format`: several tables and dict literals here are
# hand-aligned for readability, and a formatter would flatten them for no
# behavioural gain. Lint catches bugs; formatting is a style argument.

line-length = 100
target-version = "py310"

[lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes -- undefined names, unused imports
    "I",       # import sorting
    "B",       # bugbear -- likely bugs
    "UP",      # pyupgrade
    "C4",      # comprehension simplifications
    "SIM",     # simplifications
]
ignore = [
    # `Depends(...)` in a parameter default is FastAPI's documented dependency
    # injection idiom, not an accidental shared mutable default.
    "B008",
]

[lint.per-file-ignores]
# The eval CLI sets LOG_LEVEL before importing the agent, because the logger
# is configured at import time. The import order is the point.
"evals/__main__.py" = ["E402"]
# Tests reach into private helpers deliberately.
"tests/*" = ["E402"]

[lint.isort]
known-first-party = [
    "research_agent", "vector_memory", "retry", "sessions",
    "service", "usage", "observability", "metrics", "evals",
]

# fly.toml configuration for the RESEARCH AGENT app.
#
# This must never name the Postgres app. `fly postgres create` makes a
# separate, Fly-managed app that you attach to -- you do not deploy into
# it. Fly's GitHub integration once rewrote this line to 'research-agent-db',
# which made `fly deploy` try to push the agent image onto the database;
# only a volume-name clash (agent_data vs pg_data) stopped it.
# tests/test_deploy_config.py guards this now.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'research-agent-rippling-waterfall-9963'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  AGENT_MAX_RUN_COST_USD = '1.00'
  LOG_FORMAT = 'json'
  LOG_LEVEL = 'INFO'
  METRICS_DB_PATH = '/data/metrics.db'
  SESSION_DB_PATH = '/data/sessions.db'
  VECTOR_STORE_PATH = '/data/agent_memory_store.json'

# Needed only while the stores are on local disk. Once DATABASE_URL is set,
# all three move to Postgres, the machine holds no state, and this can go.
[[mounts]]
  source = 'agent_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  # One machine while the stores are on a per-machine volume: a second would
  # hold its own database, so a follow-up could land on a machine that has
  # never heard of the session. Safe to raise once DATABASE_URL is set.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 16
    soft_limit = 8

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# --- Going stateless (Phase 8) ------------------------------------------
#
#   fly postgres create --name research-agent-db
#   fly postgres attach research-agent-db -a research-agent-rippling-waterfall-9963
#   fly deploy -a research-agent-rippling-waterfall-9963
#   fly ssh console -a research-agent-rippling-waterfall-9963 \
#       -C "python /app/migrate_to_postgres.py --dry-run"
#
# Always pass -a explicitly. `fly postgres attach` sets DATABASE_URL as a
# secret on the AGENT app; the database app is managed by Fly and is never a
# deploy target.
#
# Then remove the [[mounts]] block above and: fly scale count 2

# fly.toml configuration for the RESEARCH AGENT app.
#
# Edited by hand. Do NOT merge Fly's "New files from Fly.io Launch" pull
# requests into it -- they regenerate this file from the web UI's defaults and
# have twice broken the deploy:
#
#   * once by pointing `app` at the Postgres cluster, so `fly deploy` tried to
#     push the agent image onto the database (a volume-name clash stopped it);
#   * once by setting internal_port to 8080 while the container listens on
#     8000 -- which merges without a conflict, because it touches a line this
#     file hasn't changed since the branch point.
#
# tests/test_deploy_config.py now fails the build on both. Take any value you
# want from such a PR by hand; don't merge the file.
#
# primary_region is pinned to the volume: changing it means destroying
# agent_data and losing whatever is in it.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'research-agent'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  AGENT_MAX_RUN_COST_USD = '1.00'
  # Demo guardrails. The per-run cap above bounds one runaway run; these bound
  # the bill for a URL anyone can reach. Set DEMO_TOKEN as a secret (not here)
  # to close writes entirely.
  DEMO_DAILY_USD_CAP = '5.00'
  DEMO_RATE_LIMIT_PER_HOUR = '10'
  LOG_FORMAT = 'json'
  LOG_LEVEL = 'INFO'
  METRICS_DB_PATH = '/data/metrics.db'
  SESSION_DB_PATH = '/data/sessions.db'
  VECTOR_STORE_PATH = '/data/agent_memory_store.json'

# Needed only while the stores are on local disk. Once DATABASE_URL is set,
# all three move to Postgres, the machine holds no state, and this can go.
[[mounts]]
  source = 'agent_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  # One machine while the stores are on a per-machine volume: a second would
  # hold its own database, so a follow-up could land on a machine that has
  # never heard of the session. Safe to raise once DATABASE_URL is set.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 16
    soft_limit = 8

  # /health is the LIVENESS probe: it reports unreachable dependencies in the
  # body and still returns 200, because restarting a machine does not fix a
  # database that is down. Never point this at /ready -- that returns 503 when
  # a store is unreachable, which here would mean a restart loop.
  #
  # The timeout allows for three store probes each bounded by
  # PG_CONNECT_TIMEOUT (3s), so a fully unreachable database still answers
  # inside the window instead of timing the check out.
  [[http_service.checks]]
    interval = '30s'
    timeout = '15s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# --- Going stateless (Phase 8) ------------------------------------------
#
#   fly postgres create --name research-agent-db
#   fly postgres attach <db-app> -a research-agent
#   fly deploy -a research-agent
#   fly ssh console -a research-agent -C "python /app/migrate_to_postgres.py --dry-run"
#
# Always pass -a explicitly. `fly postgres attach` sets DATABASE_URL as a
# secret on the AGENT app; the database app is managed by Fly and is never a
# deploy target.
#
# Then remove the [[mounts]] block above and: fly scale count 2

# fly.toml configuration for the RESEARCH AGENT app.
#
# Edited by hand. Do NOT merge Fly's "New files from Fly.io Launch" pull
# requests into it -- they regenerate this file from the web UI's defaults and
# have twice broken the deploy:
#
#   * once by pointing `app` at the Postgres cluster, so `fly deploy` tried to
#     push the agent image onto the database (a volume-name clash stopped it);
#   * once by setting internal_port to 8080 while the container listens on
#     8000 -- which merges without a conflict, because it touches a line this
#     file hasn't changed since the branch point.
#
# tests/test_deploy_config.py now fails the build on both. Take any value you
# want from such a PR by hand; don't merge the file.
#
# primary_region was pinned to the volume. The mount is gone, so it is now a
# choice rather than a constraint: 'syd' sits next to the database's region
# (ap-southeast-2, Sydney), and every /health store probe pays that hop 120
# times an hour. Measured: connect+TLS 119.2 ms, query p50 2.73 ms. Changing
# region is out of scope -- the provider's project region cannot be changed
# after creation either, so the two would have to move together.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'research-agent'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  AGENT_MAX_RUN_COST_USD = '1.00'
  # The critic runs on a MORE CAPABLE model than the writer, which runs on
  # claude-sonnet-5. That is a design position, not a tuning knob --
  # docs/adr/0010-judge-rederived-for-an-independent-critic.md records it and
  # the reasoning: a gate no stronger than the thing it gates waves through the
  # mistakes it would have made itself.
  #
  # Committed, unlike SESSIONS_TOKEN and DATABASE_URL, which are secrets and
  # live in `fly secrets set`. A model name is configuration and discloses
  # nothing, and the stance is only visible if it is written down where the
  # deploy reads it.
  #
  # The code default is NEUTRAL: graph.critic_model() reads an absent or blank
  # CRITIC_MODEL as MODEL, so CI, the test suite, the offline evals and every
  # keyless context run the critic on the writer's model exactly as before.
  # This line is the whole flip, and the deployed service is the only thing
  # that sees it.
  #
  # Which is also why deleting it fails OPEN, unlike the backend pins below:
  # the critic silently reverts to the writer's model, the revision loop keeps
  # working, /health stays ok, Fly's check passes, and the only trace is a
  # smaller number in the demo's cost line. tests/test_deploy_config.py pins
  # the VALUE for that reason -- and this file has been rewritten by Fly's
  # tooling twice, which is how a key disappears with nobody deciding to
  # remove it.
  CRITIC_MODEL = 'claude-opus-5'
  # The classifier also runs on Opus 5 -- docs/adr/0013-classifier-on-its-own-
  # model.md records the measurement (37/38 against the writer's model's 32/38
  # over the labelled golden set on the 2026-08-16 repeat, five fixes, zero
  # regressions -- the n=1 first pass read 34/38 vs 29/38 -- about +$0.0005
  # a run). Its label picks the researcher's strategy and the critic's rubric,
  # so getting it wrong mis-aims both.
  #
  # Read the safety direction here BACKWARDS from CRITIC_MODEL above. That
  # line is load-bearing and deleting it fails open; deleting THIS one changes
  # nothing at all, because graph.classifier_model() reads an absent or blank
  # CLASSIFIER_MODEL as claude-opus-5 -- the code default is the same model
  # this line names. It is written here so the per-node model stance is
  # readable in one place, not because the deploy depends on it.
  #
  # What IS dangerous is drift, and that is what the deploy test pins. The
  # knob is live: a value here other than claude-opus-5 silently moves
  # production off the measured choice with every check in the repository
  # still green. So tests/test_deploy_config.py asserts the VALUE while
  # treating ABSENCE as legal -- the inverse of CRITIC_MODEL's pin, for the
  # inverse reason.
  CLASSIFIER_MODEL = 'claude-opus-5'
  # Demo guardrails. The per-run cap above (AGENT_MAX_RUN_COST_USD) bounds one
  # runaway run; these bound the bill for a URL anyone can reach. The session
  # read/delete tree is closed by SESSIONS_TOKEN, set as a secret (`fly secrets
  # set`, never here -- this file is committed). DEMO_TOKEN would close writes
  # entirely, but it fronts the demo's own POST /research/stream, so setting it
  # on this app 401s every anonymous visitor; leave it unset.
  DEMO_DAILY_USD_CAP = '5.00'
  DEMO_RATE_LIMIT_PER_HOUR = '10'
  LOG_FORMAT = 'json'
  LOG_LEVEL = 'INFO'
  # The three backend pins, and they are load-bearing rather than
  # belt-and-braces. The *_DB_PATH vars that used to sit here are gone with
  # the mount, but deleting them is NOT what stops a fallback to local
  # SQLite: sessions.py defaults SESSION_DB_PATH to a file beside the module,
  # and default_backend() returns 'sqlite' whenever no DSN is configured. So
  # unpinned, two mount-less machines would each boot on their own
  # container-local database, /health would report dependencies: "ok"
  # (SQLite is perfectly reachable), Fly's check would pass, and the only
  # difference on the wire would be a backend class name nothing reads.
  #
  # Pinned, the same situation fails CLOSED: db.database_url() raises
  # RuntimeError naming DATABASE_URL at store construction, lifespan raises,
  # and the machine never reaches started. Loud beats quiet for a config
  # error, and a restart does not conjure a missing secret either way.
  #
  # Note the distinction: only an ABSENT DSN fails closed. A reachability
  # OUTAGE (DSN present, server down) still comes up and reports the
  # unreachable store in /health's body, because Database.__init__ does no
  # I/O. That is deliberate -- restarting does not fix someone else's server.
  METRICS_BACKEND = 'postgres'
  SESSION_BACKEND = 'postgres'
  VECTOR_STORE = 'pgvector'

[http_service]
  internal_port = 8000
  force_https = true
  # Two machines. This was 1 for as long as the stores lived on a per-machine
  # volume, because a second machine would have held its own database and a
  # follow-up could land on one that had never heard of the session.
  #
  # All three preconditions now hold, in order: DATABASE_URL is set and
  # /health shows three Postgres-backed stores; the [[mounts]] block and the
  # three *_DB_PATH vars are gone; the three backend pins are in [env]. Do
  # not lower it back to 1 without restoring the mount AND removing the pins
  # -- a mounted machine with the pins still set refuses to boot without a
  # DSN. tests/test_deploy_config.py asserts both directions of that pairing.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 2

  # These numbers are why the connection pool is sized the way it is:
  # hard_limit 16 x 2 machines = up to 32 in-flight requests against one
  # database. PG_POOL_MAX_SIZE defaults to 5, so the fleet holds at most 10
  # of the provider tier's 60 connections; requests past that queue on a
  # checkout bounded by PG_POOL_TIMEOUT rather than opening connection 33.
  [http_service.concurrency]
    type = 'requests'
    hard_limit = 16
    soft_limit = 8

  # /health is the LIVENESS probe: it reports unreachable dependencies in the
  # body and still returns 200, because restarting a machine does not fix a
  # database that is down. Never point this at /ready -- that returns 503 when
  # a store is unreachable, which here would mean a restart loop.
  #
  # The 15s timeout covers three sequential store probes. Two numbers, and
  # only the second is a bound:
  #
  #   * typical, pool empty and database unreachable:
  #       3 x PG_POOL_TIMEOUT (2.0s) ~= 6s. This describes the COLD pool
  #       only. A warm pool holding a connection to a peer that has gone
  #       away returns from checkout instantly and then blocks on a socket,
  #       so the checkout timeout bounds nothing in that case.
  #   * ceiling, and the number that matters:
  #       3 x HEALTH_PROBE_BUDGET (3.0s) = 9s, enforced by the per-probe
  #       wall-clock deadline added in plan 11-02. Holds whether the pool is
  #       cold, warm or partitioned. Measured at 0.32s against a store that
  #       never answers, versus 31.4s with the deadline removed.
  #
  # The deadline exists because statement_timeout and tcp_user_timeout bound
  # a slow server and a peer that stops ACKing, but not one that keeps the
  # socket alive and never answers.
  #
  # This comment previously claimed the window allowed "three probes each
  # bounded by PG_CONNECT_TIMEOUT (3s)". That was wrong by a factor of two:
  # the pre-pool cursor() made two 3s connect attempts per probe, so three
  # probes could cost 18s against a 15s timeout -- the check would expire
  # and both machines would restart for a fault a restart cannot fix.
  [[http_service.checks]]
    interval = '30s'
    timeout = '15s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# --- Going stateless (Phase 11) -----------------------------------------
#
# This footer used to document the unmanaged Fly Postgres commands. Fly's own
# CLI now prints that unmanaged Fly Postgres is not supported by Fly.io
# Support and that users are responsible for operations, management and
# disaster recovery, so the database is an EXTERNAL provider (Supabase,
# ap-southeast-2) reached over DATABASE_URL. There is no attach step:
# `fly secrets set` is what sets the variable, and nothing is a deploy target
# but this app.
#
# The order below is load-bearing, because a machine with neither a volume
# nor a reachable database is a broken machine.
#
#   1. Create the Supabase project in ap-southeast-2 (Oceania/Sydney) and
#      enable the `vector` extension. The project region cannot be changed
#      afterwards.
#   2. fly secrets set -a research-agent DATABASE_URL='postgresql://postgres.<ref>:<pw>@aws-<n>-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require'
#      The SESSION-mode pooler host, port 5432 -- it is IPv4-reachable, while
#      the direct endpoint is IPv6-only on the free tier. sslmode=require is
#      not optional: libpq defaults to `prefer`, which silently accepts
#      plaintext, and db.py passes the DSN through untouched.
#      This triggers a deploy on its own.
#   3. fly deploy -a research-agent   (if the secret did not already)
#   4. Verify: curl https://research-agent.fly.dev/health -- three
#      Postgres-backed stores, dependencies ok. Create a session and read it
#      back. Do not proceed until this passes.
#   5. Only then: remove the [[mounts]] block and the three *_DB_PATH vars
#      above, AND add SESSION_BACKEND='postgres', METRICS_BACKEND='postgres',
#      VECTOR_STORE='pgvector' to [env] in the same edit. The pins make a
#      missing DSN fail closed instead of silently falling back to
#      container-local SQLite. Deploy.
#   6. Raise min_machines_running to 2 and: fly scale count 2
#
# Steps 1-6 are DONE -- this file is the result. Steps 1-4 were reversible
# (`fly secrets unset`, delete the project) and production was untouched
# throughout; step 5 was the point of no return for per-machine state.
#
# Rolling back now means all four parts together: restore [[mounts]], restore
# the three *_DB_PATH vars, DELETE the three backend pins, and
# `fly scale count 1`. Restoring the mount while leaving the pins in place
# gives a machine that still refuses to boot without a DSN. The SQLite data
# on the volume is stale by however long the service has run on Postgres, so
# prefer fixing forward. `fly secrets unset DATABASE_URL` has never been
# exercised -- it is the documented escape hatch, not a proven one.
#
# KEEP THE VOLUME. Detaching is reversible -- an unattached agent_data still
# exists and a machine that does not require a volume never attaches itself
# to one -- and destroying is not. `fly volumes destroy` is not part of this
# procedure at any point.
#
# docs/OPERATIONS.md carries the same sequence with the operator detail.

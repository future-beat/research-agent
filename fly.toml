# fly.toml app configuration file generated for research-agent on 2026-08-01T16:30:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'research-agent'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  AGENT_MAX_RUN_COST_USD = '1.00'
  LOG_FORMAT = 'json'
  LOG_LEVEL = 'INFO'
  METRICS_DB_PATH = '/data/metrics.db'
  SESSION_DB_PATH = '/data/sessions.db'
  VECTOR_STORE_PATH = '/data/agent_memory_store.json'

[[mounts]]
  source = 'agent_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 16
    soft_limit = 8

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
